[project]
name = "interview-agent"
version = "0.1.0"
description = "Local mock interview agent backend"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "supertonic>=1.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "trafilatura>=1.12",
  "pypdf>=5.0",
  "python-multipart>=0.0.9",
  "mlx-whisper>=0.4",
  "numpy>=1.26",
  "mlx-lm>=0.28",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "websockets>=17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
